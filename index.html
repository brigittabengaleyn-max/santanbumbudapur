<!DOCTYPE html><!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santan & Bumbu Dapur – Cita Rasa Asli Nusantara</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #5D3621;
  --primary-light: #7B4A2B;
  --secondary: #F8F3EB;
  --accent: #D9A441;
  --accent-green: #5D8A4A;
  --cream: #F8F2E8;
  --cream-dark: #EFE2CB;
  --white: #FFFFFF;
  --text-dark: #2C1810;
  --text-mid: #5A3E30;
  --text-light: #8B7163;
  --shadow-sm: 0 2px 12px rgba(93,54,33,0.08);
  --shadow-md: 0 8px 32px rgba(93,54,33,0.12);
  --shadow-lg: 0 20px 60px rgba(93,54,33,0.15);
  --radius-sm: 12px;
  --radius-md: 20px;
  --radius-lg: 28px;
  --radius-xl: 40px;
}
html { scroll-behavior: smooth; }
body { font-family: 'Poppins', sans-serif; background: #FFFFFF; color: var(--text-dark); overflow-x: hidden; }

/* ── NAVBAR ── */
.navbar-wrap { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); width: calc(100% - 48px); max-width: 1200px; z-index: 1000; transition: top 0.3s; }
.navbar {
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(20px);
  border-radius: 50px;
  padding: 14px 28px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 4px 24px rgba(93,54,33,0.13), 0 1px 3px rgba(93,54,33,0.06);
  border: 1px solid rgba(217,164,65,0.15);
  transition: padding 0.3s;
}
.nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.nav-logo-img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
.nav-logo-text { font-size: 13px; font-weight: 700; color: var(--primary); line-height: 1.2; }
.nav-logo-text span { display: block; font-weight: 400; font-size: 10px; color: var(--text-light); }
.nav-links { display: flex; gap: 2px; }
.nav-links a {
  text-decoration: none; font-size: 13px; font-weight: 500; color: var(--text-mid);
  padding: 8px 12px; border-radius: 30px;
  transition: all 0.25s ease;
}
.nav-links a:hover, .nav-links a.active { background: var(--cream); color: var(--primary); }
.nav-actions { display: flex; align-items: center; gap: 10px; }
.btn-wa {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: white; border: none; padding: 9px 18px; border-radius: 30px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; gap: 7px;
  transition: all 0.25s ease; text-decoration: none;
  box-shadow: 0 4px 14px rgba(93,54,33,0.3);
}
.btn-wa:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(93,54,33,0.4); }
.nav-icon-btn {
  width: 38px; height: 38px; background: var(--cream); border: none; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  color: var(--primary); transition: all 0.2s; position: relative;
}
.nav-icon-btn:hover { background: var(--cream-dark); }
.cart-badge {
  position: absolute; top: -2px; right: -2px;
  background: var(--accent); color: white; font-size: 9px; font-weight: 700;
  width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  transition: transform 0.2s;
}
.cart-badge.bump { transform: scale(1.5); }
/* Hamburger */
.hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; background: none; border: none; }
.hamburger span { width: 22px; height: 2px; background: var(--primary); border-radius: 2px; transition: all 0.3s; display: block; }
.hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
.mobile-menu {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.98); backdrop-filter: blur(20px);
  z-index: 999; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
}
.mobile-menu.open { display: flex; }
.mobile-menu a {
  font-size: 20px; font-weight: 600; color: var(--text-dark); text-decoration: none;
  padding: 14px 32px; border-radius: 16px; transition: all 0.2s; width: 260px; text-align: center;
}
.mobile-menu a:hover { background: var(--cream); color: var(--primary); }
.mobile-menu-close {
  position: absolute; top: 24px; right: 24px;
  background: var(--cream); border: none; border-radius: 50%; width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  font-size: 20px; color: var(--primary);
}
.mobile-wa {
  margin-top: 16px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white !important; border-radius: 50px !important;
}

/* ── HERO ── */
.hero {
  min-height: 100vh;
  background: linear-gradient(135deg, #FFFDF9 0%, #F8F2E8 40%, #F0E4CC 100%);
  display: flex; align-items: center;
  position: relative; overflow: hidden; padding-top: 100px;
}
.hero-shape-1 {
  position: absolute; top: -100px; right: -150px;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(217,164,65,0.12) 0%, transparent 70%);
  border-radius: 50%; pointer-events: none;
}
.hero-shape-2 {
  position: absolute; bottom: -80px; left: -100px;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(93,54,33,0.06) 0%, transparent 70%);
  border-radius: 50%; pointer-events: none;
}
.hero-inner { max-width: 1200px; margin: 0 auto; padding: 40px 24px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; position: relative; z-index: 2; }
.hero-left { padding: 20px 0; }
.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: white; border: 1.5px solid rgba(217,164,65,0.4);
  padding: 7px 16px; border-radius: 30px; margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}
.hero-badge-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.hero-badge span { font-size: 12.5px; font-weight: 600; color: var(--primary); }
.hero-title { font-size: clamp(30px, 4vw, 52px); font-weight: 800; line-height: 1.15; color: var(--text-dark); margin-bottom: 18px; }
.hero-title em { font-style: normal; color: var(--primary); position: relative; }
.hero-title em::after {
  content: ''; position: absolute; bottom: 2px; left: 0; right: 0;
  height: 3px; background: linear-gradient(90deg, var(--accent), transparent);
  border-radius: 2px;
}
.hero-sub { font-size: 15px; line-height: 1.7; color: var(--text-light); margin-bottom: 32px; max-width: 480px; font-weight: 400; }
.hero-cta { display: flex; gap: 14px; margin-bottom: 32px; flex-wrap: wrap; }
.btn-primary {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: white; border: none; padding: 14px 28px; border-radius: 50px;
  font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
  box-shadow: 0 6px 24px rgba(93,54,33,0.35); transition: all 0.3s ease;
  display: inline-flex; align-items: center; gap: 8px;
}
.btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 32px rgba(93,54,33,0.45); }
.btn-secondary-outline {
  background: transparent; color: var(--primary);
  border: 2px solid var(--primary); padding: 12px 24px; border-radius: 50px;
  font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
  transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 8px;
}
.btn-secondary-outline:hover { background: var(--cream); }
.trust-list { display: flex; gap: 16px; margin-bottom: 40px; flex-wrap: wrap; }
.trust-item { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: var(--text-mid); }
.trust-check { width: 20px; height: 20px; background: var(--accent-green); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; flex-shrink: 0; }
.hero-stats { display: flex; gap: 0; border-top: 1px solid rgba(93,54,33,0.1); padding-top: 24px; }
.stat-item { flex: 1; padding-right: 20px; }
.stat-item:not(:last-child) { border-right: 1px solid rgba(93,54,33,0.1); margin-right: 20px; }
.stat-num { font-size: 28px; font-weight: 800; color: var(--primary); line-height: 1; }
.stat-label { font-size: 11px; color: var(--text-light); margin-top: 4px; font-weight: 500; }

/* HERO RIGHT */
.hero-right { position: relative; display: flex; align-items: center; justify-content: center; }
.hero-visual-wrap { position: relative; width: 100%; max-width: 520px; }
.hero-img-main {
  width: 100%; border-radius: var(--radius-lg);
  box-shadow: 0 24px 70px rgba(93,54,33,0.22);
  object-fit: cover; display: block;
}
.float-card {
  position: absolute; background: white; border-radius: 16px;
  box-shadow: 0 8px 32px rgba(93,54,33,0.15); padding: 12px 16px;
  animation: floatY 3s ease-in-out infinite;
}
@keyframes floatY { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.float-card-promo {
  bottom: -16px; left: 10px;
  display: flex; align-items: center; gap: 12px;
  animation-delay: 0s;
}
.float-card-promo .promo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--accent), #E8B455); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.float-card-promo .promo-text .label { font-size: 10px; color: var(--text-light); font-weight: 500; }
.float-card-promo .promo-text strong { display: block; font-size: 12px; color: var(--text-dark); font-weight: 700; }
.float-badge-bestseller {
  top: 16px; right: -10px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white; border-radius: 50px; font-size: 11px; font-weight: 700;
  display: flex; align-items: center; gap: 6px; animation-delay: 1s;
}
.float-badge-fav {
  top: 60px; right: -10px;
  border: 2px solid rgba(217,164,65,0.3); border-radius: 50px;
  font-size: 11px; font-weight: 600; color: var(--accent); animation-delay: 0.5s;
}

/* ── SECTION BASE ── */
section { padding: 90px 24px; }
.container { max-width: 1200px; margin: 0 auto; }
.section-eyebrow { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; color: var(--accent); margin-bottom: 10px; }
.section-title { font-size: clamp(26px, 3.2vw, 42px); font-weight: 800; color: var(--text-dark); line-height: 1.2; margin-bottom: 14px; }
.section-desc { font-size: 15px; color: var(--text-light); max-width: 560px; line-height: 1.7; }

/* ── TENTANG KAMI ── */
.about { background: #FFFFFF; }
.about-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 70px; align-items: center; }
.about-images { position: relative; padding-bottom: 40px; padding-right: 40px; }
.about-img-main {
  width: 100%; aspect-ratio: 4/3; object-fit: cover;
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); display: block;
}
.about-img-secondary {
  position: absolute; bottom: 0; right: 0;
  width: 180px; aspect-ratio: 1/1; object-fit: cover;
  border-radius: var(--radius-md); border: 4px solid white;
  box-shadow: var(--shadow-md); display: block;
}
.about-year-badge {
  position: absolute; top: 20px; left: -20px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white; padding: 14px 18px; border-radius: var(--radius-md);
  box-shadow: var(--shadow-md); text-align: center;
}
.about-year-badge .year { font-size: 24px; font-weight: 800; line-height: 1; }
.about-year-badge .label { font-size: 10px; font-weight: 500; opacity: 0.85; margin-top: 2px; }
.about-right { padding-left: 10px; }
.about-story { font-size: 15px; line-height: 1.8; color: var(--text-mid); margin-bottom: 32px; }
.about-features { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.about-feat-card { background: var(--cream); padding: 18px; border-radius: var(--radius-sm); border: 1px solid rgba(217,164,65,0.2); }
.about-feat-card .icon { font-size: 22px; margin-bottom: 8px; }
.about-feat-card h4 { font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
.about-feat-card p { font-size: 12px; color: var(--text-light); line-height: 1.5; }

/* ── PRODUK UNGGULAN ── */
.products { background: var(--cream); padding: 90px 0; }
.products .container { padding: 0 24px; }
.products-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 48px; flex-wrap: wrap; gap: 20px; }
.slider-controls { display: flex; gap: 12px; }
.slider-btn {
  width: 48px; height: 48px; background: white; border: 2px solid rgba(93,54,33,0.15);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--primary); transition: all 0.25s; font-size: 18px;
}
.slider-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
.products-slider-wrap { overflow: hidden; }
.products-slider { display: flex; gap: 20px; transition: transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94); }
.product-card {
  flex-shrink: 0; width: 220px;
  background: white; border-radius: var(--radius-md); overflow: hidden;
  box-shadow: var(--shadow-sm); transition: all 0.3s ease;
  border: 1px solid rgba(217,164,65,0.1);
}
.product-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-lg); }
.product-card-img {
  position: relative; aspect-ratio: 1/1; overflow: hidden;
  background: var(--cream);
}
.product-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
.product-card:hover .product-card-img img { transform: scale(1.05); }
.product-badge {
  position: absolute; top: 12px; left: 12px;
  background: var(--accent); color: white; font-size: 10px; font-weight: 700;
  padding: 4px 10px; border-radius: 30px; text-transform: uppercase; letter-spacing: 0.5px;
}
.product-card-body { padding: 16px; }
.product-name { font-size: 14px; font-weight: 700; color: var(--text-dark); margin-bottom: 4px; }
.product-desc { font-size: 11.5px; color: var(--text-light); line-height: 1.5; margin-bottom: 8px; }
.product-rating { display: flex; align-items: center; gap: 5px; margin-bottom: 10px; }
.stars { color: var(--accent); font-size: 11px; letter-spacing: 1px; }
.rating-num { font-size: 11px; color: var(--text-light); font-weight: 500; }
.product-footer { display: flex; align-items: center; justify-content: space-between; }
.product-price { font-size: 16px; font-weight: 800; color: var(--primary); }
.btn-cart {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white; border: none; padding: 8px 14px; border-radius: 50px;
  font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; gap: 4px;
}
.btn-cart:hover { transform: scale(1.05); box-shadow: 0 4px 14px rgba(93,54,33,0.35); }
.btn-cart.added { background: linear-gradient(135deg, var(--accent-green), #4a7040); }

/* ── RESEP ── */
.recipes { background: white; }
.recipes-header { text-align: center; margin-bottom: 52px; }
.recipes-header .section-desc { margin: 0 auto; }
.recipes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
.recipe-card {
  background: white; border-radius: 24px; overflow: hidden;
  box-shadow: var(--shadow-sm); transition: all 0.35s ease;
  border: 1px solid rgba(93,54,33,0.07);
}
.recipe-card:hover { transform: translateY(-10px); box-shadow: var(--shadow-lg); }
.recipe-img { overflow: hidden; aspect-ratio: 4/3; background: var(--cream); }
.recipe-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; display: block; }
.recipe-card:hover .recipe-img img { transform: scale(1.06); }
.recipe-body { padding: 22px; }
.recipe-meta { display: flex; gap: 14px; margin-bottom: 12px; }
.recipe-meta-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-light); font-weight: 500; }
.recipe-name { font-size: 18px; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; }
.recipe-desc { font-size: 13px; color: var(--text-light); line-height: 1.6; margin-bottom: 18px; }
.btn-recipe {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--cream); color: var(--primary); padding: 10px 20px;
  border-radius: 30px; font-size: 13px; font-weight: 600;
  border: 1.5px solid rgba(93,54,33,0.15); transition: all 0.25s;
  cursor: pointer; font-family: 'Poppins', sans-serif;
}
.btn-recipe:hover { background: var(--primary); color: white; border-color: var(--primary); }

/* ── MENGAPA PILIH ── */
.why { background: linear-gradient(135deg, var(--primary) 0%, #4A2A18 100%); padding: 90px 24px; }
.why-inner { max-width: 1200px; margin: 0 auto; }
.why .section-eyebrow { color: var(--accent); }
.why .section-title { color: white; }
.why .section-desc { color: rgba(255,255,255,0.7); }
.why-header { margin-bottom: 56px; }
.why-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.why-card {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--radius-md); padding: 32px 24px; text-align: center;
  transition: all 0.3s ease; backdrop-filter: blur(10px);
}
.why-card:hover { background: rgba(255,255,255,0.12); transform: translateY(-6px); }
.why-icon-wrap {
  width: 68px; height: 68px; background: linear-gradient(135deg, var(--accent), #E8B455);
  border-radius: 18px; display: flex; align-items: center; justify-content: center;
  margin: 0 auto 18px; font-size: 30px; box-shadow: 0 8px 24px rgba(217,164,65,0.35);
}
.why-card h3 { font-size: 16px; font-weight: 700; color: white; margin-bottom: 10px; }
.why-card p { font-size: 13px; color: rgba(255,255,255,0.65); line-height: 1.6; }

/* ── TESTIMONI ── */
.testimonials { background: var(--secondary); }
.testi-header { text-align: center; margin-bottom: 52px; }
.testi-header .section-desc { margin: 0 auto; }
.testi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.testi-card {
  background: white; border-radius: var(--radius-md); padding: 30px;
  box-shadow: var(--shadow-sm); border: 1px solid rgba(217,164,65,0.12);
  transition: all 0.3s;
}
.testi-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-md); }
.testi-quote { font-size: 44px; line-height: 1; color: var(--accent); opacity: 0.4; font-family: Georgia, serif; margin-bottom: -8px; }
.testi-text { font-size: 14px; color: var(--text-mid); line-height: 1.75; margin-bottom: 22px; font-style: italic; }
.testi-footer { display: flex; align-items: center; gap: 14px; }
.testi-avatar {
  width: 50px; height: 50px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--primary));
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: white; font-weight: 700; overflow: hidden;
}
.testi-name { font-size: 14px; font-weight: 700; color: var(--text-dark); }
.testi-role { font-size: 11px; color: var(--text-light); margin-bottom: 4px; }
.testi-stars { color: var(--accent); font-size: 12px; letter-spacing: 1px; }

/* ── FAQ ── */
.faq { background: white; }
.faq-inner { max-width: 780px; margin: 0 auto; }
.faq-header { text-align: center; margin-bottom: 48px; }
.faq-header .section-desc { margin: 0 auto; }
.faq-item { border: 1.5px solid rgba(93,54,33,0.1); border-radius: var(--radius-sm); margin-bottom: 12px; overflow: hidden; transition: all 0.3s; }
.faq-item.open { border-color: rgba(217,164,65,0.4); box-shadow: var(--shadow-sm); }
.faq-question {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 22px; cursor: pointer; background: white;
  font-size: 14.5px; font-weight: 600; color: var(--text-dark);
  transition: all 0.25s; user-select: none;
}
.faq-item.open .faq-question { background: var(--cream); color: var(--primary); }
.faq-question:hover { background: var(--cream); }
.faq-icon {
  width: 26px; height: 26px; background: var(--cream); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  font-size: 18px; color: var(--primary); transition: transform 0.35s;
}
.faq-item.open .faq-icon { transform: rotate(45deg); background: var(--accent); color: white; }
.faq-answer {
  max-height: 0; overflow: hidden; transition: max-height 0.4s ease, padding 0.3s;
  font-size: 14px; color: var(--text-light); line-height: 1.7; padding: 0 22px;
}
.faq-item.open .faq-answer { max-height: 200px; padding: 0 22px 18px; }

/* ── KONTAK ── */
.contact { background: var(--cream); }
.contact-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start; }
.contact-header { margin-bottom: 32px; }
.contact-info-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 32px; }
.contact-info-item {
  display: flex; align-items: center; gap: 14px;
  background: white; padding: 16px 18px; border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm); border: 1px solid rgba(217,164,65,0.15);
}
.contact-info-icon {
  width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), var(--primary-light));
  border-radius: 12px; display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0; color: white;
}
.contact-info-text .label { font-size: 11px; color: var(--text-light); font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
.contact-info-text strong { display: block; font-size: 14px; font-weight: 600; color: var(--text-dark); margin-top: 2px; }
.btn-wa-lg {
  background: linear-gradient(135deg, #25D366, #128C7E);
  color: white; border: none; padding: 14px 28px; border-radius: 50px;
  font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; text-decoration: none;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 6px 24px rgba(37,211,102,0.35); transition: all 0.3s;
}
.btn-wa-lg:hover { transform: translateY(-3px); box-shadow: 0 10px 32px rgba(37,211,102,0.45); }
.map-container {
  border-radius: var(--radius-lg); overflow: hidden;
  box-shadow: var(--shadow-lg); height: 400px; border: 3px solid white;
}
.map-container iframe { width: 100%; height: 100%; border: none; }

/* ── FOOTER ── */
.footer { background: var(--text-dark); padding: 70px 24px 30px; }
.footer-inner { max-width: 1200px; margin: 0 auto; }
.footer-top { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1.2fr; gap: 50px; margin-bottom: 50px; }
.footer-brand .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.footer-brand .logo-img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
.footer-brand .logo-name { font-size: 14px; font-weight: 700; color: white; }
.footer-brand .logo-name span { display: block; font-size: 11px; font-weight: 400; color: rgba(255,255,255,0.5); }
.footer-brand p { font-size: 13px; color: rgba(255,255,255,0.55); line-height: 1.7; margin-bottom: 18px; }
.footer-social { display: flex; gap: 10px; }
.social-btn {
  width: 36px; height: 36px; background: rgba(255,255,255,0.08); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 15px;
  text-decoration: none; transition: all 0.2s; color: white;
}
.social-btn:hover { background: var(--accent); }
.footer-col h4 { font-size: 14px; font-weight: 700; color: white; margin-bottom: 18px; }
.footer-col ul { list-style: none; }
.footer-col ul li { margin-bottom: 9px; }
.footer-col ul li a { font-size: 13px; color: rgba(255,255,255,0.55); text-decoration: none; transition: color 0.2s; }
.footer-col ul li a:hover { color: var(--accent); }
.footer-newsletter p { font-size: 13px; color: rgba(255,255,255,0.55); line-height: 1.6; margin-bottom: 14px; }
.newsletter-form { display: flex; gap: 8px; }
.newsletter-form input {
  flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 30px; padding: 10px 16px; color: white; font-size: 13px; font-family: 'Poppins', sans-serif;
}
.newsletter-form input::placeholder { color: rgba(255,255,255,0.4); }
.newsletter-form input:focus { outline: none; border-color: var(--accent); }
.newsletter-form button {
  background: var(--accent); color: var(--primary); border: none; padding: 10px 18px;
  border-radius: 30px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
  transition: all 0.2s; font-family: 'Poppins', sans-serif;
}
.newsletter-form button:hover { background: #E8B455; }
.footer-bottom { border-top: 1px solid rgba(255,255,255,0.08); padding-top: 26px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
.footer-bottom p { font-size: 13px; color: rgba(255,255,255,0.4); }
.footer-bottom-links { display: flex; gap: 18px; flex-wrap: wrap; }
.footer-bottom-links a { font-size: 13px; color: rgba(255,255,255,0.4); text-decoration: none; transition: color 0.2s; }
.footer-bottom-links a:hover { color: var(--accent); }

/* wave */
.wave-divider { line-height: 0; }
.wave-divider svg { display: block; width: 100%; }

/* ── MODAL RESEP ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  z-index: 2000; display: flex; align-items: center; justify-content: center;
  padding: 24px; opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal-box {
  background: white; border-radius: 28px; max-width: 600px; width: 100%;
  max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px rgba(0,0,0,0.3);
  transform: scale(0.9) translateY(20px); transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
}
.modal-overlay.open .modal-box { transform: scale(1) translateY(0); }
.modal-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 28px 28px 0 0; }
.modal-body { padding: 28px 32px 32px; }
.modal-tag {
  display: inline-block; background: var(--cream); color: var(--accent);
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
  padding: 5px 14px; border-radius: 30px; margin-bottom: 14px;
  border: 1.5px solid rgba(217,164,65,0.3);
}
.modal-title { font-size: 26px; font-weight: 800; color: var(--text-dark); margin-bottom: 20px; line-height: 1.2; }
.modal-section { margin-bottom: 20px; }
.modal-section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); margin-bottom: 10px; }
.modal-ingredients { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.modal-ingredient {
  display: flex; align-items: center; gap: 8px;
  font-size: 13.5px; color: var(--text-mid); font-weight: 500;
}
.modal-ingredient::before { content: '•'; color: var(--accent); font-size: 18px; flex-shrink: 0; }
.modal-steps { list-style: none; counter-reset: step; }
.modal-steps li {
  counter-increment: step; display: flex; gap: 14px;
  margin-bottom: 14px; font-size: 14px; color: var(--text-mid); line-height: 1.6;
}
.modal-steps li::before {
  content: counter(step); min-width: 28px; height: 28px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 1px;
}
.modal-close {
  position: sticky; top: 0; float: right; margin: 16px 16px -16px 0;
  z-index: 1; width: 36px; height: 36px;
  background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
  border-radius: 50%; border: 1.5px solid rgba(93,54,33,0.15);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--primary); font-size: 18px;
  box-shadow: var(--shadow-sm); transition: all 0.2s;
}
.modal-close:hover { background: var(--primary); color: white; }

/* ── Toast notifikasi ── */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--primary); color: white; padding: 12px 24px; border-radius: 50px;
  font-size: 14px; font-weight: 600; z-index: 3000;
  box-shadow: 0 8px 24px rgba(93,54,33,0.4);
  transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s;
  opacity: 0; white-space: nowrap; display: flex; align-items: center; gap: 8px;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* ── RESPONSIVE ── */
@media (max-width: 1024px) {
  .footer-top { grid-template-columns: 1fr 1fr; gap: 36px; }
  .why-grid { grid-template-columns: repeat(2, 1fr); }
  .nav-links { gap: 0; }
  .nav-links a { font-size: 12px; padding: 7px 10px; }
}

@media (max-width: 768px) {
  .navbar-wrap { width: calc(100% - 32px); top: 12px; }
  .navbar { padding: 12px 18px; }
  .nav-links { display: none; }
  .hamburger { display: flex; }
  .hero-inner { grid-template-columns: 1fr; gap: 32px; }
  .hero-right { order: -1; }
  .hero-visual-wrap { max-width: 100%; }
  .hero-left { text-align: center; }
  .hero-cta { justify-content: center; }
  .trust-list { justify-content: center; }
  .hero-stats { justify-content: center; }
  .about-inner { grid-template-columns: 1fr; gap: 24px; }
  .about-images { padding-bottom: 28px; padding-right: 28px; }
  .about-year-badge { left: -10px; top: 14px; }
  .about-right { padding-left: 0; }
  .recipes-grid { grid-template-columns: 1fr; }
  .testi-grid { grid-template-columns: 1fr; }
  .why-grid { grid-template-columns: 1fr 1fr; }
  .contact-inner { grid-template-columns: 1fr; }
  .map-container { height: 280px; }
  .footer-top { grid-template-columns: 1fr; gap: 32px; }
  .footer-bottom { flex-direction: column; text-align: center; }
  .modal-ingredients { grid-template-columns: 1fr; }
  .float-badge-bestseller, .float-badge-fav { display: none; }
  section { padding: 60px 16px; }
  .products { padding: 60px 0; }
  .products .container { padding: 0 16px; }
  .nav-actions .btn-wa { display: none; }
}

@media (max-width: 480px) {
  .hero-title { font-size: 26px; }
  .why-grid { grid-template-columns: 1fr; }
  .stat-num { font-size: 22px; }
  .about-img-secondary { width: 130px; }
  .modal-body { padding: 20px; }
  .modal-title { font-size: 20px; }
}

/* Tablet product slider */
@media (min-width: 481px) and (max-width: 1024px) {
  .product-card { width: 200px; }
}

  border-radius: 50px;
  padding: 14px 28px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 4px 24px rgba(93,54,33,0.13), 0 1px 3px rgba(93,54,33,0.06);
  border: 1px solid rgba(217,164,65,0.15);
  transition: padding 0.3s;
}
.nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.nav-logo-img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
.nav-logo-text { font-size: 13px; font-weight: 700; color: var(--primary); line-height: 1.2; }
.nav-logo-text span { display: block; font-weight: 400; font-size: 10px; color: var(--text-light); }
.nav-links { display: flex; gap: 2px; }
.nav-links a {
  text-decoration: none; font-size: 13px; font-weight: 500; color: var(--text-mid);
  padding: 8px 12px; border-radius: 30px;
  transition: all 0.25s ease;
}
.nav-links a:hover, .nav-links a.active { background: var(--cream); color: var(--primary); }
.nav-actions { display: flex; align-items: center; gap: 10px; }
.btn-wa {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: white; border: none; padding: 9px 18px; border-radius: 30px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; gap: 7px;
  transition: all 0.25s ease; text-decoration: none;
  box-shadow: 0 4px 14px rgba(93,54,33,0.3);
}
.btn-wa:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(93,54,33,0.4); }
.nav-icon-btn {
  width: 38px; height: 38px; background: var(--cream); border: none; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  color: var(--primary); transition: all 0.2s; position: relative;
}
.nav-icon-btn:hover { background: var(--cream-dark); }
.cart-badge {
  position: absolute; top: -2px; right: -2px;
  background: var(--accent); color: white; font-size: 9px; font-weight: 700;
  width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  transition: transform 0.2s;
}
.cart-badge.bump { transform: scale(1.5); }
/* Hamburger */
.hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; background: none; border: none; }
.hamburger span { width: 22px; height: 2px; background: var(--primary); border-radius: 2px; transition: all 0.3s; display: block; }
.hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
.mobile-menu {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.98); backdrop-filter: blur(20px);
  z-index: 999; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
}
.mobile-menu.open { display: flex; }
.mobile-menu a {
  font-size: 20px; font-weight: 600; color: var(--text-dark); text-decoration: none;
  padding: 14px 32px; border-radius: 16px; transition: all 0.2s; width: 260px; text-align: center;
}
.mobile-menu a:hover { background: var(--cream); color: var(--primary); }
.mobile-menu-close {
  position: absolute; top: 24px; right: 24px;
  background: var(--cream); border: none; border-radius: 50%; width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  font-size: 20px; color: var(--primary);
}
.mobile-wa {
  margin-top: 16px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white !important; border-radius: 50px !important;
}

/* ── HERO ── */
.hero {
  min-height: 100vh;
  background: linear-gradient(135deg, #FFFDF9 0%, #F8F2E8 40%, #F0E4CC 100%);
  display: flex; align-items: center;
  position: relative; overflow: hidden; padding-top: 100px;
}
.hero-shape-1 {
  position: absolute; top: -100px; right: -150px;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(217,164,65,0.12) 0%, transparent 70%);
  border-radius: 50%; pointer-events: none;
}
.hero-shape-2 {
  position: absolute; bottom: -80px; left: -100px;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(93,54,33,0.06) 0%, transparent 70%);
  border-radius: 50%; pointer-events: none;
}
.hero-inner { max-width: 1200px; margin: 0 auto; padding: 40px 24px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; position: relative; z-index: 2; }
.hero-left { padding: 20px 0; }
.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: white; border: 1.5px solid rgba(217,164,65,0.4);
  padding: 7px 16px; border-radius: 30px; margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}
.hero-badge-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.hero-badge span { font-size: 12.5px; font-weight: 600; color: var(--primary); }
.hero-title { font-size: clamp(30px, 4vw, 52px); font-weight: 800; line-height: 1.15; color: var(--text-dark); margin-bottom: 18px; }
.hero-title em { font-style: normal; color: var(--primary); position: relative; }
.hero-title em::after {
  content: ''; position: absolute; bottom: 2px; left: 0; right: 0;
  height: 3px; background: linear-gradient(90deg, var(--accent), transparent);
  border-radius: 2px;
}
.hero-sub { font-size: 15px; line-height: 1.7; color: var(--text-light); margin-bottom: 32px; max-width: 480px; font-weight: 400; }
.hero-cta { display: flex; gap: 14px; margin-bottom: 32px; flex-wrap: wrap; }
.btn-primary {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: white; border: none; padding: 14px 28px; border-radius: 50px;
  font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
  box-shadow: 0 6px 24px rgba(93,54,33,0.35); transition: all 0.3s ease;
  display: inline-flex; align-items: center; gap: 8px;
}
.btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 32px rgba(93,54,33,0.45); }
.btn-secondary-outline {
  background: transparent; color: var(--primary);
  border: 2px solid var(--primary); padding: 12px 24px; border-radius: 50px;
  font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
  transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 8px;
}
.btn-secondary-outline:hover { background: var(--cream); }
.trust-list { display: flex; gap: 16px; margin-bottom: 40px; flex-wrap: wrap; }
.trust-item { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: var(--text-mid); }
.trust-check { width: 20px; height: 20px; background: var(--accent-green); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; flex-shrink: 0; }
.hero-stats { display: flex; gap: 0; border-top: 1px solid rgba(93,54,33,0.1); padding-top: 24px; }
.stat-item { flex: 1; padding-right: 20px; }
.stat-item:not(:last-child) { border-right: 1px solid rgba(93,54,33,0.1); margin-right: 20px; }
.stat-num { font-size: 28px; font-weight: 800; color: var(--primary); line-height: 1; }
.stat-label { font-size: 11px; color: var(--text-light); margin-top: 4px; font-weight: 500; }

/* HERO RIGHT */
.hero-right { position: relative; display: flex; align-items: center; justify-content: center; }
.hero-visual-wrap { position: relative; width: 100%; max-width: 520px; }
.hero-img-main {
  width: 100%; border-radius: var(--radius-lg);
  box-shadow: 0 24px 70px rgba(93,54,33,0.22);
  object-fit: cover; display: block;
}
.float-card {
  position: absolute; background: white; border-radius: 16px;
  box-shadow: 0 8px 32px rgba(93,54,33,0.15); padding: 12px 16px;
  animation: floatY 3s ease-in-out infinite;
}
@keyframes floatY { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.float-card-promo {
  bottom: -16px; left: 10px;
  display: flex; align-items: center; gap: 12px;
  animation-delay: 0s;
}
.float-card-promo .promo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--accent), #E8B455); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.float-card-promo .promo-text .label { font-size: 10px; color: var(--text-light); font-weight: 500; }
.float-card-promo .promo-text strong { display: block; font-size: 12px; color: var(--text-dark); font-weight: 700; }
.float-badge-bestseller {
  top: 16px; right: -10px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white; border-radius: 50px; font-size: 11px; font-weight: 700;
  display: flex; align-items: center; gap: 6px; animation-delay: 1s;
}
.float-badge-fav {
  top: 60px; right: -10px;
  border: 2px solid rgba(217,164,65,0.3); border-radius: 50px;
  font-size: 11px; font-weight: 600; color: var(--accent); animation-delay: 0.5s;
}

/* ── SECTION BASE ── */
section { padding: 90px 24px; }
.container { max-width: 1200px; margin: 0 auto; }
.section-eyebrow { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; color: var(--accent); margin-bottom: 10px; }
.section-title { font-size: clamp(26px, 3.2vw, 42px); font-weight: 800; color: var(--text-dark); line-height: 1.2; margin-bottom: 14px; }
.section-desc { font-size: 15px; color: var(--text-light); max-width: 560px; line-height: 1.7; }

/* ── TENTANG KAMI ── */
.about { background: #FFFFFF; }
.about-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 70px; align-items: center; }
.about-images { position: relative; padding-bottom: 40px; padding-right: 40px; }
.about-img-main {
  width: 100%; aspect-ratio: 4/3; object-fit: cover;
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); display: block;
}
.about-img-secondary {
  position: absolute; bottom: 0; right: 0;
  width: 180px; aspect-ratio: 1/1; object-fit: cover;
  border-radius: var(--radius-md); border: 4px solid white;
  box-shadow: var(--shadow-md); display: block;
}
.about-year-badge {
  position: absolute; top: 20px; left: -20px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white; padding: 14px 18px; border-radius: var(--radius-md);
  box-shadow: var(--shadow-md); text-align: center;
}
.about-year-badge .year { font-size: 24px; font-weight: 800; line-height: 1; }
.about-year-badge .label { font-size: 10px; font-weight: 500; opacity: 0.85; margin-top: 2px; }
.about-right { padding-left: 10px; }
.about-story { font-size: 15px; line-height: 1.8; color: var(--text-mid); margin-bottom: 32px; }
.about-features { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.about-feat-card { background: var(--cream); padding: 18px; border-radius: var(--radius-sm); border: 1px solid rgba(217,164,65,0.2); }
.about-feat-card .icon { font-size: 22px; margin-bottom: 8px; }
.about-feat-card h4 { font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
.about-feat-card p { font-size: 12px; color: var(--text-light); line-height: 1.5; }

/* ── PRODUK UNGGULAN ── */
.products { background: var(--cream); padding: 90px 0; }
.products .container { padding: 0 24px; }
.products-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 48px; flex-wrap: wrap; gap: 20px; }
.slider-controls { display: flex; gap: 12px; }
.slider-btn {
  width: 48px; height: 48px; background: white; border: 2px solid rgba(93,54,33,0.15);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--primary); transition: all 0.25s; font-size: 18px;
}
.slider-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
.products-slider-wrap { overflow: hidden; }
.products-slider { display: flex; gap: 20px; transition: transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94); }
.product-card {
  flex-shrink: 0; width: 220px;
  background: white; border-radius: var(--radius-md); overflow: hidden;
  box-shadow: var(--shadow-sm); transition: all 0.3s ease;
  border: 1px solid rgba(217,164,65,0.1);
}
.product-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-lg); }
.product-card-img {
  position: relative; aspect-ratio: 1/1; overflow: hidden;
  background: var(--cream);
}
.product-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
.product-card:hover .product-card-img img { transform: scale(1.05); }
.product-badge {
  position: absolute; top: 12px; left: 12px;
  background: var(--accent); color: white; font-size: 10px; font-weight: 700;
  padding: 4px 10px; border-radius: 30px; text-transform: uppercase; letter-spacing: 0.5px;
}
.product-card-body { padding: 16px; }
.product-name { font-size: 14px; font-weight: 700; color: var(--text-dark); margin-bottom: 4px; }
.product-desc { font-size: 11.5px; color: var(--text-light); line-height: 1.5; margin-bottom: 8px; }
.product-rating { display: flex; align-items: center; gap: 5px; margin-bottom: 10px; }
.stars { color: var(--accent); font-size: 11px; letter-spacing: 1px; }
.rating-num { font-size: 11px; color: var(--text-light); font-weight: 500; }
.product-footer { display: flex; align-items: center; justify-content: space-between; }
.product-price { font-size: 16px; font-weight: 800; color: var(--primary); }
.btn-cart {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white; border: none; padding: 8px 14px; border-radius: 50px;
  font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; gap: 4px;
}
.btn-cart:hover { transform: scale(1.05); box-shadow: 0 4px 14px rgba(93,54,33,0.35); }
.btn-cart.added { background: linear-gradient(135deg, var(--accent-green), #4a7040); }

/* ── RESEP ── */
.recipes { background: white; }
.recipes-header { text-align: center; margin-bottom: 52px; }
.recipes-header .section-desc { margin: 0 auto; }
.recipes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
.recipe-card {
  background: white; border-radius: 24px; overflow: hidden;
  box-shadow: var(--shadow-sm); transition: all 0.35s ease;
  border: 1px solid rgba(93,54,33,0.07);
}
.recipe-card:hover { transform: translateY(-10px); box-shadow: var(--shadow-lg); }
.recipe-img { overflow: hidden; aspect-ratio: 4/3; background: var(--cream); }
.recipe-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; display: block; }
.recipe-card:hover .recipe-img img { transform: scale(1.06); }
.recipe-body { padding: 22px; }
.recipe-meta { display: flex; gap: 14px; margin-bottom: 12px; }
.recipe-meta-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-light); font-weight: 500; }
.recipe-name { font-size: 18px; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; }
.recipe-desc { font-size: 13px; color: var(--text-light); line-height: 1.6; margin-bottom: 18px; }
.btn-recipe {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--cream); color: var(--primary); padding: 10px 20px;
  border-radius: 30px; font-size: 13px; font-weight: 600;
  border: 1.5px solid rgba(93,54,33,0.15); transition: all 0.25s;
  cursor: pointer; font-family: 'Poppins', sans-serif;
}
.btn-recipe:hover { background: var(--primary); color: white; border-color: var(--primary); }

/* ── MENGAPA PILIH ── */
.why { background: linear-gradient(135deg, var(--primary) 0%, #4A2A18 100%); padding: 90px 24px; }
.why-inner { max-width: 1200px; margin: 0 auto; }
.why .section-eyebrow { color: var(--accent); }
.why .section-title { color: white; }
.why .section-desc { color: rgba(255,255,255,0.7); }
.why-header { margin-bottom: 56px; }
.why-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.why-card {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--radius-md); padding: 32px 24px; text-align: center;
  transition: all 0.3s ease; backdrop-filter: blur(10px);
}
.why-card:hover { background: rgba(255,255,255,0.12); transform: translateY(-6px); }
.why-icon-wrap {
  width: 68px; height: 68px; background: linear-gradient(135deg, var(--accent), #E8B455);
  border-radius: 18px; display: flex; align-items: center; justify-content: center;
  margin: 0 auto 18px; font-size: 30px; box-shadow: 0 8px 24px rgba(217,164,65,0.35);
}
.why-card h3 { font-size: 16px; font-weight: 700; color: white; margin-bottom: 10px; }
.why-card p { font-size: 13px; color: rgba(255,255,255,0.65); line-height: 1.6; }

/* ── TESTIMONI ── */
.testimonials { background: var(--secondary); }
.testi-header { text-align: center; margin-bottom: 52px; }
.testi-header .section-desc { margin: 0 auto; }
.testi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.testi-card {
  background: white; border-radius: var(--radius-md); padding: 30px;
  box-shadow: var(--shadow-sm); border: 1px solid rgba(217,164,65,0.12);
  transition: all 0.3s;
}
.testi-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-md); }
.testi-quote { font-size: 44px; line-height: 1; color: var(--accent); opacity: 0.4; font-family: Georgia, serif; margin-bottom: -8px; }
.testi-text { font-size: 14px; color: var(--text-mid); line-height: 1.75; margin-bottom: 22px; font-style: italic; }
.testi-footer { display: flex; align-items: center; gap: 14px; }
.testi-avatar {
  width: 50px; height: 50px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--primary));
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: white; font-weight: 700; overflow: hidden;
}
.testi-name { font-size: 14px; font-weight: 700; color: var(--text-dark); }
.testi-role { font-size: 11px; color: var(--text-light); margin-bottom: 4px; }
.testi-stars { color: var(--accent); font-size: 12px; letter-spacing: 1px; }

/* ── FAQ ── */
.faq { background: white; }
.faq-inner { max-width: 780px; margin: 0 auto; }
.faq-header { text-align: center; margin-bottom: 48px; }
.faq-header .section-desc { margin: 0 auto; }
.faq-item { border: 1.5px solid rgba(93,54,33,0.1); border-radius: var(--radius-sm); margin-bottom: 12px; overflow: hidden; transition: all 0.3s; }
.faq-item.open { border-color: rgba(217,164,65,0.4); box-shadow: var(--shadow-sm); }
.faq-question {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 22px; cursor: pointer; background: white;
  font-size: 14.5px; font-weight: 600; color: var(--text-dark);
  transition: all 0.25s; user-select: none;
}
.faq-item.open .faq-question { background: var(--cream); color: var(--primary); }
.faq-question:hover { background: var(--cream); }
.faq-icon {
  width: 26px; height: 26px; background: var(--cream); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  font-size: 18px; color: var(--primary); transition: transform 0.35s;
}
.faq-item.open .faq-icon { transform: rotate(45deg); background: var(--accent); color: white; }
.faq-answer {
  max-height: 0; overflow: hidden; transition: max-height 0.4s ease, padding 0.3s;
  font-size: 14px; color: var(--text-light); line-height: 1.7; padding: 0 22px;
}
.faq-item.open .faq-answer { max-height: 200px; padding: 0 22px 18px; }

/* ── KONTAK ── */
.contact { background: var(--cream); }
.contact-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start; }
.contact-header { margin-bottom: 32px; }
.contact-info-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 32px; }
.contact-info-item {
  display: flex; align-items: center; gap: 14px;
  background: white; padding: 16px 18px; border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm); border: 1px solid rgba(217,164,65,0.15);
}
.contact-info-icon {
  width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), var(--primary-light));
  border-radius: 12px; display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0; color: white;
}
.contact-info-text .label { font-size: 11px; color: var(--text-light); font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
.contact-info-text strong { display: block; font-size: 14px; font-weight: 600; color: var(--text-dark); margin-top: 2px; }
.btn-wa-lg {
  background: linear-gradient(135deg, #25D366, #128C7E);
  color: white; border: none; padding: 14px 28px; border-radius: 50px;
  font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; text-decoration: none;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 6px 24px rgba(37,211,102,0.35); transition: all 0.3s;
}
.btn-wa-lg:hover { transform: translateY(-3px); box-shadow: 0 10px 32px rgba(37,211,102,0.45); }
.map-container {
  border-radius: var(--radius-lg); overflow: hidden;
  box-shadow: var(--shadow-lg); height: 400px; border: 3px solid white;
}
.map-container iframe { width: 100%; height: 100%; border: none; }

/* ── FOOTER ── */
.footer { background: var(--text-dark); padding: 70px 24px 30px; }
.footer-inner { max-width: 1200px; margin: 0 auto; }
.footer-top { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1.2fr; gap: 50px; margin-bottom: 50px; }
.footer-brand .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.footer-brand .logo-img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
.footer-brand .logo-name { font-size: 14px; font-weight: 700; color: white; }
.footer-brand .logo-name span { display: block; font-size: 11px; font-weight: 400; color: rgba(255,255,255,0.5); }
.footer-brand p { font-size: 13px; color: rgba(255,255,255,0.55); line-height: 1.7; margin-bottom: 18px; }
.footer-social { display: flex; gap: 10px; }
.social-btn {
  width: 36px; height: 36px; background: rgba(255,255,255,0.08); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 15px;
  text-decoration: none; transition: all 0.2s; color: white;
}
.social-btn:hover { background: var(--accent); }
.footer-col h4 { font-size: 14px; font-weight: 700; color: white; margin-bottom: 18px; }
.footer-col ul { list-style: none; }
.footer-col ul li { margin-bottom: 9px; }
.footer-col ul li a { font-size: 13px; color: rgba(255,255,255,0.55); text-decoration: none; transition: color 0.2s; }
.footer-col ul li a:hover { color: var(--accent); }
.footer-newsletter p { font-size: 13px; color: rgba(255,255,255,0.55); line-height: 1.6; margin-bottom: 14px; }
.newsletter-form { display: flex; gap: 8px; }
.newsletter-form input {
  flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 30px; padding: 10px 16px; color: white; font-size: 13px; font-family: 'Poppins', sans-serif;
}
.newsletter-form input::placeholder { color: rgba(255,255,255,0.4); }
.newsletter-form input:focus { outline: none; border-color: var(--accent); }
.newsletter-form button {
  background: var(--accent); color: var(--primary); border: none; padding: 10px 18px;
  border-radius: 30px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
  transition: all 0.2s; font-family: 'Poppins', sans-serif;
}
.newsletter-form button:hover { background: #E8B455; }
.footer-bottom { border-top: 1px solid rgba(255,255,255,0.08); padding-top: 26px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
.footer-bottom p { font-size: 13px; color: rgba(255,255,255,0.4); }
.footer-bottom-links { display: flex; gap: 18px; flex-wrap: wrap; }
.footer-bottom-links a { font-size: 13px; color: rgba(255,255,255,0.4); text-decoration: none; transition: color 0.2s; }
.footer-bottom-links a:hover { color: var(--accent); }

/* wave */
.wave-divider { line-height: 0; }
.wave-divider svg { display: block; width: 100%; }

/* ── MODAL RESEP ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  z-index: 2000; display: flex; align-items: center; justify-content: center;
  padding: 24px; opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal-box {
  background: white; border-radius: 28px; max-width: 600px; width: 100%;
  max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 80px rgba(0,0,0,0.3);
  transform: scale(0.9) translateY(20px); transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
}
.modal-overlay.open .modal-box { transform: scale(1) translateY(0); }
.modal-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 28px 28px 0 0; }
.modal-body { padding: 28px 32px 32px; }
.modal-tag {
  display: inline-block; background: var(--cream); color: var(--accent);
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
  padding: 5px 14px; border-radius: 30px; margin-bottom: 14px;
  border: 1.5px solid rgba(217,164,65,0.3);
}
.modal-title { font-size: 26px; font-weight: 800; color: var(--text-dark); margin-bottom: 20px; line-height: 1.2; }
.modal-section { margin-bottom: 20px; }
.modal-section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); margin-bottom: 10px; }
.modal-ingredients { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.modal-ingredient {
  display: flex; align-items: center; gap: 8px;
  font-size: 13.5px; color: var(--text-mid); font-weight: 500;
}
.modal-ingredient::before { content: '•'; color: var(--accent); font-size: 18px; flex-shrink: 0; }
.modal-steps { list-style: none; counter-reset: step; }
.modal-steps li {
  counter-increment: step; display: flex; gap: 14px;
  margin-bottom: 14px; font-size: 14px; color: var(--text-mid); line-height: 1.6;
}
.modal-steps li::before {
  content: counter(step); min-width: 28px; height: 28px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 1px;
}
.modal-close {
  position: sticky; top: 0; float: right; margin: 16px 16px -16px 0;
  z-index: 1; width: 36px; height: 36px;
  background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
  border-radius: 50%; border: 1.5px solid rgba(93,54,33,0.15);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--primary); font-size: 18px;
  box-shadow: var(--shadow-sm); transition: all 0.2s;
}
.modal-close:hover { background: var(--primary); color: white; }

/* ── Toast notifikasi ── */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--primary); color: white; padding: 12px 24px; border-radius: 50px;
  font-size: 14px; font-weight: 600; z-index: 3000;
  box-shadow: 0 8px 24px rgba(93,54,33,0.4);
  transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s;
  opacity: 0; white-space: nowrap; display: flex; align-items: center; gap: 8px;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* ── RESPONSIVE ── */
@media (max-width: 1024px) {
  .footer-top { grid-template-columns: 1fr 1fr; gap: 36px; }
  .why-grid { grid-template-columns: repeat(2, 1fr); }
  .nav-links { gap: 0; }
  .nav-links a { font-size: 12px; padding: 7px 10px; }
}

@media (max-width: 768px) {
  .navbar-wrap { width: calc(100% - 32px); top: 12px; }
  .navbar { padding: 12px 18px; }
  .nav-links { display: none; }
  .hamburger { display: flex; }
  .hero-inner { grid-template-columns: 1fr; gap: 32px; }
  .hero-right { order: -1; }
  .hero-visual-wrap { max-width: 100%; }
  .hero-left { text-align: center; }
  .hero-cta { justify-content: center; }
  .trust-list { justify-content: center; }
  .hero-stats { justify-content: center; }
  .about-inner { grid-template-columns: 1fr; gap: 24px; }
  .about-images { padding-bottom: 28px; padding-right: 28px; }
  .about-year-badge { left: -10px; top: 14px; }
  .about-right { padding-left: 0; }
  .recipes-grid { grid-template-columns: 1fr; }
  .testi-grid { grid-template-columns: 1fr; }
  .why-grid { grid-template-columns: 1fr 1fr; }
  .contact-inner { grid-template-columns: 1fr; }
  .map-container { height: 280px; }
  .footer-top { grid-template-columns: 1fr; gap: 32px; }
  .footer-bottom { flex-direction: column; text-align: center; }
  .modal-ingredients { grid-template-columns: 1fr; }
  .float-badge-bestseller, .float-badge-fav { display: none; }
  section { padding: 60px 16px; }
  .products { padding: 60px 0; }
  .products .container { padding: 0 16px; }
  .nav-actions .btn-wa { display: none; }
}

@media (max-width: 480px) {
  .hero-title { font-size: 26px; }
  .why-grid { grid-template-columns: 1fr; }
  .stat-num { font-size: 22px; }
  .about-img-secondary { width: 130px; }
  .modal-body { padding: 20px; }
  .modal-title { font-size: 20px; }
}

/* Tablet product slider */
@media (min-width: 481px) and (max-width: 1024px) {
  .product-card { width: 200px; }
}
</style>
